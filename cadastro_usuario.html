<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Usuário - Funcionário</title>
</head>
<body>
 
    <form>
        <table width="100%">
 
            <tr>
                <td width="20%"></td>
                <td width="60%"><h1 align="center">Cadastro</h1></td>
                <td width="20%"></td>
            </tr>
 
            <tr>
                <td></td>
                <td>
                    <p align="center"><br><br><br>
 
                    <fieldset>
                        <legend><b>Informações Pessoais:</b></legend>
                        <br>
                        <p align="center">
 
                        <label>E-mail:</label><br>
                        <input type="email" autofocus required placeholder="Digite seu e-mail"><br><br><br>
 
                        <label for="fname">Nome:</label><br>
                        <input type="text" id="fname" name="fname" required placeholder="Digite seu primeiro nome"><br><br><br>
 
                        <label for="lname">Sobrenome:</label><br>
                        <input type="text" id="lname" name="lname" required placeholder="Digite seu sobrenome"><br><br><br>
 
                        <label>Sexo:</label><br>
                        <label>Masculino</label>
                        <input type="checkbox">
                        <label>Feminino</label>
                        <input type="checkbox"><br><br><br>
 
                        <label for="birthday">Data de nascimento:</label><br><br>
                        <input type="date" id="birthday" name="birthday"><br><br><br>
 
                        <label for="nome_mae">Nome da sua mãe:</label><br>
                        <input type="text" id="nome_mae" name="nome_mae" placeholder="Digite o nome completo da sua mãe"><br><br><br>
 
                        <label>Nacionalidade:</label><br>
                        <select required> <!-- menu dropdown -->
                            <option>Brasileiro Nato</option>
                            <option>Estrangeiro</option>
                            <option>Naturalizado Brasileiro</option>
                        </select>
 
                        </p>
                    </fieldset><br><br><br>
 
                    <fieldset>
                        <legend><b>Endereço e Contato:</b></legend>
                        <br>
                        <p align="center">
 
                        <label>CEP:</label><br>
                        <input placeholder="00.000-000" required><br><br><br>
 
                        <label>Estado:</label><br>
                        <select required> <!-- menu dropdown -->
                            <option>GO</option>
                            <option>MT</option>
                            <option>SP</option>
                        </select><br><br><br>
 
                        <label>Endereço:</label><br>
                        <input type="text" required placeholder="Digite o nome da rua"><br><br><br>
 
                        <label>Número:</label><br>
                        <input type="text" required placeholder="Digite o número da sua residência"><br><br><br>
 
                        <label>Complemento:</label><br>
                        <input type="text" required placeholder="Digite o complemento do seu endereço"><br><br><br>
 
                        <label>Bairro:</label><br>
                        <input type="text" required placeholder="Digite o bairro onde mora"><br><br><br>
 
                        <label>Cidade:</label><br>
                        <input type="text" required placeholder="Informe a cidade que você mora"><br><br><br>
 
                        <label>Telefone:</label><br>
                        <input placeholder="(00) 00000-0000" required>
 
                        </p>
                    </fieldset><br><br><br>
 
                    <fieldset>
                        <legend><b>Defina a Senha:</b></legend>
                        <br>
                        <p align="center">
 
                        <label for="senha">Senha:</label><br>
                        <input type="password" id="senha" name="senha" minlength="8" required><br><br>
 
                        </p>
                    </fieldset><br><br>
 
                    <p align="center">
                        <a href="login_usuario.html"><button type="button">Cadastrar</button></a>
                        <button type="reset">Limpar Formulário</button>
                    </p>
 
                </td>
                <td></td>
            </tr>
 
        </table>
    </form>
 
</body>
</html>
